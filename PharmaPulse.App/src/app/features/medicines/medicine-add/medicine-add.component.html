<h2 mat-dialog-title>Add New Medicine</h2>

<mat-dialog-content>
  <form [formGroup]="addForm" id="medicineAddForm" (ngSubmit)="onSubmit()" class="add-medicine-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Full Name</mat-label>
      <input matInput formControlName="fullName" [placeholder]="PLACEHOLDERS.FULL_NAME" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Brand</mat-label>
      <input matInput formControlName="brand" [placeholder]="PLACEHOLDERS.BRAND" />
    </mat-form-field>


    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Quantity</mat-label>
        <input matInput type="number" formControlName="quantity" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Price ($)</mat-label>
        <input matInput type="number" step="0.01" formControlName="price" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Expiry Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="expiryDate" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notes (Optional)</mat-label>
      <textarea matInput formControlName="notes" rows="2"></textarea>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close type="button">Cancel</button>
  <button mat-raised-button color="primary" type="submit" form="medicineAddForm">Add Medicine</button>
</mat-dialog-actions>

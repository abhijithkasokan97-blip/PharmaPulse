<div class="page-container">
  <mat-card appearance="outlined">
    <mat-card-header class="header-container">
      <div class="header-content">
        <mat-card-title class="page-title">Medicine Inventory</mat-card-title>
        <div class="actions-group">
          <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
            <mat-icon matPrefix>search</mat-icon>
            <input 
              matInput 
              [formControl]="searchControl" 
              placeholder="Search medicines..."
              autocomplete="off"
            />
            <button 
              *ngIf="searchControl.value"
              mat-icon-button 
              matSuffix 
              type="button"
              aria-label="Clear search" 
              (click)="searchControl.setValue('')"
            >
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>

          <button mat-raised-button color="primary" class="add-btn" (click)="openAddMedicineModal()">
            <mat-icon>add</mat-icon>
            <span>Add Medicine</span>
          </button>
        </div>
      </div>
    </mat-card-header>

    <mat-card-content class="table-container">
        <table mat-table [dataSource]="medicines()" class="full-width-table">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let element">
            <div class="med-info">
              <span class="med-name">{{ element.fullName }}</span>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="brand">
          <th mat-header-cell *matHeaderCellDef> Brand </th>
          <td mat-cell *matCellDef="let element"> {{ element.brand }} </td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef> Price </th>
          <td mat-cell *matCellDef="let element"> {{ element.price }} </td>
        </ng-container>

        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef> Quantity </th>
          <td mat-cell *matCellDef="let element"> {{ element.quantity }} </td>
        </ng-container>
        
        <ng-container matColumnDef="expiryDate">
          <th mat-header-cell *matHeaderCellDef> Expiry Date </th>
          <td mat-cell *matCellDef="let element"> {{ element.expiryDate | date:'dd/MM/yyyy' }} </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" [ngClass]="row.rowHighlightClass"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
